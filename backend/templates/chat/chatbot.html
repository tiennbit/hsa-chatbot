{% extends "base.html" %}

{% block title %}HSA Chatbot - Trò chuyện{% endblock %}

{% block body_class %}chat-page-active{% endblock %}

{% block content %}
<div class="chat-layout">
    <!-- Sidebar -->
    <aside class="chat-sidebar">
        <div class="sidebar-header">
            <a href="#" class="btn btn-primary w-100" id="new-chat-btn"><i class="fas fa-plus me-2"></i>Cuộc trò chuyện
                mới</a>
        </div>
        <div class="sidebar-history">
            <h6 class="text-muted">Lịch sử trò chuyện</h6>
            <ul class="list-group list-group-flush" id="chat-history-list">
                <!-- Chat history will be loaded here by JS -->
            </ul>
        </div>
        <div class="sidebar-footer">
            <div class="d-flex align-items-center">
                <i class="fas fa-user-circle fa-2x me-2"></i>
                <div>
                    <strong>{{ current_user.full_name }}</strong>
                    <a href="{{ url_for('auth.logout') }}" class="d-block text-muted small">Đăng xuất</a>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">
        <div id="chat-container">
            <div id="chat-messages">
                <!-- Messages will be dynamically loaded here -->
            </div>
        </div>
        <div class="chat-input-area">
            <form id="chat-form" class="w-100">
                <div class="input-group">
                    <input type="text" id="message-input" class="form-control"
                        placeholder="Hỏi bất cứ điều gì về kỳ thi HSA..." autocomplete="off" required>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
